version: 1
name: validate-password
description: Write pytest tests for a supplied password-policy implementation.
input:
  prompt: Write tests/generated_tests.py that tests fixtures/password.py. Cover valid passwords and missing length, upper, lower, digit, and symbol requirements.
expected:
  type: code
execution:
  entrypoint: tests/generated_tests.py
  tests: tests/test_validate_password.py
  files:
    - fixtures/password.py
  timeout_seconds: 10
metadata:
  difficulty: medium
  category: test_writing
